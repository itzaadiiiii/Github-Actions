# Payment Service WorkFlow
name: Payment Service CI

on:
  pull_request:
    branches:
      - dev

  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:

  ci:
    uses: company/platform-ci-templates/.github/workflows/java-ci.yml@v1

    with:
      service_name: payment-service
      java_version: "21"
      ecr_repository: payment-service

    secrets: inherit
